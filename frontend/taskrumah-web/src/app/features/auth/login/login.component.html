<div class="min-h-screen bg-gradient-to-br from-purple-500 via-indigo-500 to-blue-600 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="text-7xl mb-4 animate-bounce">🏠</div>
      <h1 class="text-5xl font-black text-white mb-2">TaskRumah</h1>
      <p class="text-purple-200 text-lg font-semibold">Yuk kerjakan tugasmu hari ini! ✨</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <h2 class="text-2xl font-black text-gray-800 mb-6 text-center">Masuk Dulu!</h2>

      @if (error()) {
        <div class="bg-red-50 border-2 border-red-200 text-red-700 p-4 rounded-2xl mb-4 font-semibold">
          ⚠️ {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-2">📧 Email</label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-400 focus:outline-none font-semibold transition-all"
            placeholder="email@contoh.com"
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-700 mb-2">🔑 Password</label>
          <input
            type="password"
            formControlName="password"
            class="w-full px-4 py-3 rounded-2xl border-2 border-gray-200 focus:border-purple-400 focus:outline-none font-semibold transition-all"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading() || form.invalid"
          class="w-full btn-primary text-lg disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <span>⏳ Memuat...</span>
          } @else {
            <span>🚀 Masuk Sekarang!</span>
          }
        </button>
      </form>

      <!-- Quick Login Buttons -->
      <div class="mt-6 pt-6 border-t-2 border-gray-100">
        <p class="text-center text-sm font-bold text-gray-500 mb-3">Login cepat untuk testing:</p>
        <div class="grid grid-cols-2 gap-2">
          <button
            (click)="quickLogin('ayah@taskrumah.com', 'Ayah@123')"
            class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 px-4 rounded-xl text-sm transition-all"
          >
            👨 Ayah
          </button>
          <button
            (click)="quickLogin('ibu@taskrumah.com', 'Ibu@123')"
            class="bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-2 px-4 rounded-xl text-sm transition-all"
          >
            👩 Ibu
          </button>
          <button
            (click)="quickLogin('anak1@taskrumah.com', 'Anak1@123')"
            class="bg-green-50 hover:bg-green-100 text-green-700 font-bold py-2 px-4 rounded-xl text-sm transition-all"
          >
            🧑 Kakak
          </button>
          <button
            (click)="quickLogin('anak2@taskrumah.com', 'Anak2@123')"
            class="bg-yellow-50 hover:bg-yellow-100 text-yellow-700 font-bold py-2 px-4 rounded-xl text-sm transition-all"
          >
            👧 Dedee
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
