<div class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden selection:bg-purple-500 selection:text-white">
  <!-- Dynamic Ambient Glows (Gen-Z Mesh Aesthetics) -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/25 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/25 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-pink-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 py-6">
    <!-- Header / Branding -->
    <div class="text-center mb-7">
      <div class="inline-flex p-1 rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 shadow-xl shadow-indigo-500/25 mb-3.5">
        <img src="assets/icons/icon_ft.png" alt="FamilyTask Logo" class="w-16 h-16 rounded-[22px] object-cover bg-white shadow-inner" />
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white flex items-center justify-center gap-1.5">
        <span>Family</span><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">Task</span>
      </h1>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900/80 border border-slate-800 text-[11px] font-semibold text-slate-400 backdrop-blur-md">
        <span>✨</span>
        <span>Gamified Family Habits & Rewards</span>
      </div>
    </div>

    <!-- Login Card (Glassmorphism) -->
    <div class="bg-slate-900/85 backdrop-blur-xl rounded-3xl border border-slate-800/90 shadow-2xl p-6 sm:p-8">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-white tracking-tight">Masuk ke Akun</h2>
        <p class="text-xs text-slate-400 mt-1">Selesaikan misi harian & kumpulkan poin reward 🏆</p>
      </div>

      @if (error()) {
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3.5 rounded-xl mb-5 text-xs font-semibold flex items-start gap-2.5">
          <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
            </div>
            <input
              type="email"
              formControlName="email"
              placeholder="nama@email.com"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950/70 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 text-white placeholder-slate-500 text-sm font-medium transition-all outline-none"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-950/70 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 text-white placeholder-slate-500 text-sm font-medium transition-all outline-none"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 transition-colors cursor-pointer"
              title="Lihat password"
            >
              @if (showPassword()) {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading() || form.invalid"
          class="w-full mt-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 hover:from-indigo-500 hover:to-pink-400 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 active:scale-[0.99] transition-all duration-200 text-sm flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span>Memproses...</span>
          } @else {
            <span>Masuk Sekarang 🚀</span>
          }
        </button>
      </form>

      <!-- Quick Testing Login Section (Aesthetic interactive profile chips) -->
      <div class="mt-6 pt-5 border-t border-slate-800">
        <p class="text-center text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-3">
          ⚡ Akun Cepat (Testing):
        </p>
        <div class="grid grid-cols-2 gap-2.5">
          <!-- Papah -->
          <button
            type="button"
            (click)="quickLogin('ayah@taskrumah.com', 'Ayah@123')"
            class="group flex items-center gap-2.5 p-2 rounded-xl bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/50 transition-all text-left cursor-pointer"
          >
            <div class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition-transform">
              👨
            </div>
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white leading-tight">Papah</p>
              <p class="text-[10px] text-indigo-400 font-medium leading-none mt-0.5">Admin</p>
            </div>
          </button>

          <!-- Mamah -->
          <button
            type="button"
            (click)="quickLogin('ibu@taskrumah.com', 'Ibu@123')"
            class="group flex items-center gap-2.5 p-2 rounded-xl bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 hover:border-pink-500/50 transition-all text-left cursor-pointer"
          >
            <div class="w-8 h-8 rounded-lg bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition-transform">
              👩
            </div>
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white leading-tight">Mamah</p>
              <p class="text-[10px] text-pink-400 font-medium leading-none mt-0.5">Admin</p>
            </div>
          </button>

          <!-- Kakak -->
          <button
            type="button"
            (click)="quickLogin('anak1@taskrumah.com', 'Anak1@123')"
            class="group flex items-center gap-2.5 p-2 rounded-xl bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/50 transition-all text-left cursor-pointer"
          >
            <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition-transform">
              🧑
            </div>
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white leading-tight">Kakak</p>
              <p class="text-[10px] text-emerald-400 font-medium leading-none mt-0.5">Anak</p>
            </div>
          </button>

          <!-- Dedee -->
          <button
            type="button"
            (click)="quickLogin('anak2@taskrumah.com', 'Anak2@123')"
            class="group flex items-center gap-2.5 p-2 rounded-xl bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800 hover:border-amber-500/50 transition-all text-left cursor-pointer"
          >
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-base shrink-0 group-hover:scale-110 transition-transform">
              👧
            </div>
            <div class="overflow-hidden">
              <p class="text-xs font-bold text-white leading-tight">Dedee</p>
              <p class="text-[10px] text-amber-400 font-medium leading-none mt-0.5">Anak</p>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
