<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>FamilyTask - Kelola Tugas & Hadiah Anak</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/icon-64x64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  
  <!-- Fonts: Plus Jakarta Sans for clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="FamilyTask - Aplikasi pembiasaan mandiri dan penghargaan tugas keluarga">

  <!-- iOS / Apple Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FamilyTask">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
</head>
<body class="bg-slate-50 antialiased selection:bg-purple-500 selection:text-white">
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=4')
          .then((reg) => {
            console.log('FamilyTask PWA Service Worker terdaftar:', reg.scope);
            reg.update();
          })
          .catch((err) => console.warn('Gagal mendaftarkan Service Worker:', err));
      });
    }
  </script>
</body>
</html>
