<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Inner subtle glow border -->
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- House Body -->
  <g filter="url(#shadow)">
    <!-- House Wall -->
    <rect x="136" y="220" width="240" height="190" rx="24" fill="#ffffff"/>
    
    <!-- Door -->
    <path d="M 226 410 L 226 310 C 226 295 240 285 256 285 C 272 285 286 295 286 310 L 286 410 Z" fill="#7c3aed"/>
    <circle cx="272" cy="355" r="5" fill="#fde047"/>

    <!-- Roof -->
    <path d="M 106 230 L 256 100 L 406 230 C 414 237 406 248 394 248 L 118 248 C 106 248 98 237 106 230 Z" fill="url(#roofGrad)"/>
    <polygon points="256,125 130,235 382,235" fill="#fef3c7" opacity="0.4"/>
    
    <!-- Chimney -->
    <rect x="330" y="130" width="36" height="60" rx="8" fill="#d97706"/>

    <!-- Window -->
    <rect x="166" y="270" width="45" height="45" rx="10" fill="#e0e7ff"/>
    <line x1="188.5" y1="270" x2="188.5" y2="315" stroke="#7c3aed" stroke-width="3"/>
    <line x1="166" y1="292.5" x2="211" y2="292.5" stroke="#7c3aed" stroke-width="3"/>
  </g>

  <!-- Big Sparkling Star / Badge -->
  <g filter="url(#shadow)" transform="translate(340, 340) scale(1.1)">
    <circle cx="20" cy="20" r="55" fill="#ffffff"/>
    <circle cx="20" cy="20" r="48" fill="url(#starGrad)"/>
    <!-- Checkmark inside star circle -->
    <path d="M -2 20 L 12 34 L 42 4" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
