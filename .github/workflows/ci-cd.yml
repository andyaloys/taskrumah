name: CI / CD TaskRumah

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Validate Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET API
        run: |
          cd backend/TaskRumah.API
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/taskrumah-web/package-lock.json

      - name: Build Frontend Angular (Production)
        run: |
          cd frontend/taskrumah-web
          npm ci
          npm run build -- --configuration production

  verify-live-vps:
    name: Verify Live VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Health Check VPS (http://43.157.208.95)
        run: |
          echo "🌐 Memeriksa status TaskRumah di http://43.157.208.95 ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://43.157.208.95 || true)
          echo "HTTP Response: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ TaskRumah LIVE dan aktif di internet!"
          else
            echo "⚠️ Server mengembalikan status: $STATUS"
          fi

  deploy-vps:
    name: Auto Deploy to VPS
    needs: verify-live-vps
    runs-on: ubuntu-latest
    env:
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: SSH to VPS & Update Containers
        if: env.VPS_PASSWORD != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.208.95
          username: ubuntu
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /opt/taskrumah
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            echo "✅ Container VPS berhasil diperbarui!"

      - name: VPS Auto-Sync Status
        if: env.VPS_PASSWORD == ''
        run: echo "ℹ️ VPS Auto-Sync aktif memantau git push secara otomatis."
