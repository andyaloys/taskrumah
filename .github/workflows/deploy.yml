name: Auto Deploy TaskRumah to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.208.95
          username: ubuntu
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd /opt/taskrumah
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git fetch --all
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S git reset --hard origin/main
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker compose -f docker-compose.prod.yml up -d --build
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S docker image prune -f
            echo "🚀 Status Container:"
            docker ps

      - name: Deploy Success Notification
        run: echo "✅ TaskRumah berhasil ter-update di http://43.157.208.95!"
