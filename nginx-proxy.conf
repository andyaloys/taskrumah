upstream api {
    server taskrumah_api:8080;
}

upstream frontend {
    server taskrumah_frontend:80;
}

# HTTP Server: Redirect all traffic to HTTPS, allow ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name familytask.web.id www.familytask.web.id 43.157.208.95;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name familytask.web.id www.familytask.web.id;

    ssl_certificate /etc/letsencrypt/live/familytask.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familytask.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        alias /var/uploads/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
