services:
  postgres:
    image: postgres:16
    container_name: taskrumah_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-taskrumah}
      POSTGRES_USER: ${DB_USER:-taskrumah_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: ./backend/TaskRumah.API
      dockerfile: Dockerfile
    image: taskrumah-api:latest
    container_name: taskrumah_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-taskrumah};Username=${DB_USER:-taskrumah_user};Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TaskRumah
      Jwt__Audience: TaskRumahUsers
      Jwt__ExpiryHours: 24
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      - postgres
    networks:
      - internal
      - web

  frontend:
    build:
      context: ./frontend/taskrumah-web
      dockerfile: Dockerfile
    image: taskrumah-frontend:latest
    container_name: taskrumah_frontend
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: taskrumah_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
    networks:
      - web

volumes:
  pgdata:
  uploads:

networks:
  internal:
  web:
